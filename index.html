<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title data-t="title"></title>
<link rel="stylesheet" href="css/styles.css">
</head>
<body class="picking">
<div class="app">

  <header class="bar">
    <span class="badge mode-tag" id="mode-tag"></span>
    <h1 id="headline" data-t="headline"></h1>

    <div class="readout">
      <div class="score"><b id="score">0</b></div>
      <div class="actions">
        <button type="button" id="reset" data-t="header.reset"></button>
      </div>
    </div>
  </header>

  <main>
    <div class="stage" id="stage">
      <!-- The globe: drawn by js/app.js, from data/globe/. -->
      <canvas id="globe" aria-hidden="true"></canvas>
      <!-- Pins and labels over it, placed through the same projection. -->
      <svg id="map" xmlns="http://www.w3.org/2000/svg" role="img"
           data-t-aria-label="map.label">
        <g id="marks" aria-hidden="true"></g>
        <g id="pick" aria-hidden="true">
          <circle id="pick-ring" class="hidden"></circle>
          <circle id="pin-dot" class="hidden"></circle>
        </g>
      </svg>

      <div class="zoom">
        <button type="button" id="zoom-in" data-t-title="map.zoomIn">+</button>
        <button type="button" id="zoom-out" data-t-title="map.zoomOut">&minus;</button>
        <button type="button" id="zoom-fit" data-t-title="map.zoomFit">&#9634;</button>
      </div>

      <!-- Over the city once a guess is in, following it round the globe. -->
      <div class="place" id="place" hidden>
        <b class="place-name" id="place-name"></b>
        <span class="place-where" id="place-where"></span>
        <span class="place-pop" id="place-pop"></span>
      </div>

      <!-- The city asked for, and a fact about it as the hint. -->
      <div class="target" id="target" aria-live="polite" hidden>
        <span class="target-count" id="target-count"></span>
        <b class="target-name" id="target-name"></b>
        <p class="hint" id="hint" hidden></p>
      </div>

      <div class="round" id="round" hidden>
        <span class="round-line" id="round-line"></span>
        <button type="button" id="round-go" class="primary"></button>
      </div>

      <div class="legend" id="zoom-readout"></div>
      <div class="toast" id="toast" aria-live="polite"></div>
    </div>

    <aside class="panel">
      <h2 data-t="panel.continents"></h2>
      <ul class="regions" id="regions"></ul>
      <p class="note" data-t="panel.note"></p>
    </aside>
  </main>

  <div class="sheet" id="results" hidden>
    <div class="card" role="dialog" aria-modal="true" aria-labelledby="results-title">
      <h2 id="results-title" data-t="results.title"></h2>
      <p class="sheet-line" id="results-line"></p>
      <div class="final">
        <b id="results-total"></b>
        <span id="results-max"></span>
      </div>
      <ol class="tally" id="results-list"></ol>
      <div class="sheet-actions">
        <button type="button" id="results-share" class="share" data-t="results.share" hidden></button>
        <button type="button" id="results-look" data-t="results.look"></button>
        <button type="button" id="results-again" class="primary" data-t="results.again"></button>
      </div>
    </div>
  </div>

  <div class="splash" id="splash" hidden>
    <div class="card splash-card" role="dialog" aria-modal="true" aria-labelledby="splash-title">
      <h2 id="splash-title" data-t="splash.pick"></h2>
      <p class="sheet-line" id="splash-line"></p>
      <div class="splash-go">
        <button type="button" id="splash-daily" class="primary">
          <b data-t="splash.daily"></b><span id="splash-daily-line"></span>
        </button>
        <button type="button" id="splash-practice" aria-expanded="false" aria-controls="practice-kinds">
          <b data-t="splash.practice"></b><span data-t="splash.practiceLine"></span>
        </button>
      </div>
      <!-- Practice comes in two kinds, offered once Practice is picked. -->
      <div class="splash-go splash-kinds" id="practice-kinds" hidden>
        <button type="button" id="practice-normal">
          <b data-t="splash.normal"></b><span data-t="splash.normalLine"></span>
        </button>
        <button type="button" id="practice-country">
          <b data-t="splash.countryOnly"></b><span data-t="splash.countryOnlyLine"></span>
        </button>
      </div>
    </div>
    <b class="countdown" id="countdown" aria-live="assertive"></b>
  </div>
</div>

<script src="i18n/en.js"></script>
<script src="data/mapdata.js"></script>
<script src="data/globe/base.js"></script>
<script src="data/cities.js"></script>
<script src="js/app.js"></script>
</body>
</html>
